<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Game | Omar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #063d2e;
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8e8d5;
      margin-bottom: 40px;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 850px;
      margin: auto;
    }

    .game-card {
      background: #105640;
      border: 1px solid #24785b;
      border-radius: 18px;
      padding: 25px;
      width: 280px;
      transition: 0.3s;
    }

    .game-card:hover {
      transform: translateY(-6px);
    }

    .game-icon {
      font-size: 65px;
      margin: 15px;
    }

    .game-card h2 {
      margin-bottom: 10px;
    }

    .game-card p {
      color: #c5e5d9;
      min-height: 40px;
    }

    .play-button {
      display: inline-block;
      background: #18c99a;
      color: #062c21;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .play-button:hover {
      background: #42e8b9;
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>🎮 Choose Your Game</h1>
  <p class="subtitle">Choose a game and start playing!</p>

  <div class="games">

    <!-- GAME 1 -->
    <div class="game-card">
      <div class="game-icon">🐦</div>
      <h2>Flappy Bird</h2>
      <p>Tap, click, or press Space to fly!</p>
      <a href="game.html" class="play-button">PLAY NOW</a>
    </div>

    <!-- GAME 2 -->
<div class="game-card">
  <div class="game-icon">🏎️</div>
  <h2>Car Racing</h2>
  <p>Drive your car and avoid the traffic!</p>
  <a href="game2.html" class="play-button">PLAY NOW</a>
</div>

  </div>

  <a href="index.html" class="back">← Back to Website</a>

</body>
</html>
